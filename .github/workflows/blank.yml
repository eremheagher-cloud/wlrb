name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Instance Number (1-10)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-11-arm
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $instance = '${{ inputs.instance_number }}'

          if ($instance -notmatch '^(?:[1-9]|10)$') {
            throw 'Instance number must be between 1 and 10.'
          }

          Write-Host "Starting instance $instance"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:TEMP 'tailscale-setup.exe'

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' `
            -OutFile $installer

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/quiet' `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

          $tailscale = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          if (-not (Test-Path $tailscale)) {
            throw 'Tailscale executable not found.'
          }

          Write-Host 'Tailscale installation completed.'

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Configure TAILSCALE_AUTH_KEY in GitHub Actions Secrets.'
          }

          $tailscale = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          $service = Get-Service -Name 'Tailscale' `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            throw 'Tailscale service was not found.'
          }

          if ($service.Status -ne 'Running') {
            Start-Service -Name 'Tailscale'
          }

          $serviceReady = $false

          for ($i = 1; $i -le 12; $i++) {
            $service.Refresh()

            if ($service.Status -eq 'Running') {
              $serviceReady = $true
              break
            }

            Write-Host "Waiting for Tailscale service ($i/12)..."
            Start-Sleep -Seconds 5
          }

          if (-not $serviceReady) {
            throw 'Tailscale service did not start in time.'
          }

          $connected = $false

          for ($i = 1; $i -le 6; $i++) {
            Write-Host "Connecting Tailscale ($i/6)..."

            & $tailscale up `
              "--auth-key=$env:TAILSCALE_AUTH_KEY" `
              "--hostname=github-pc-${{ inputs.instance_number }}"

            if ($LASTEXITCODE -eq 0) {
              $connected = $true
              break
            }

            Write-Host 'Tailscale is not ready; retrying in 10 seconds.'
            Start-Sleep -Seconds 10
          }

          if (-not $connected) {
            throw 'Tailscale could not connect. Check the auth key and service logs.'
          }

          Write-Host 'Tailscale connection command completed.'

      - name: Configure Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue

          Set-Service -Name 'TermService' -StartupType Automatic
          Start-Service -Name 'TermService'

          Write-Host 'Remote Desktop configuration completed.'

      - name: Create Rafael Account
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Username = 'Rafael'
          $Password = 'Wl7mX#2026@Pc!'

          $SecurePassword = ConvertTo-SecureString `
            $Password -AsPlainText -Force

          $User = Get-LocalUser -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -eq $User) {
            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -Description 'Windows account Rafael' `
              -ErrorAction Stop | Out-Null
          }
          else {
            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -ErrorAction Stop
          }

          Enable-LocalUser -Name $Username

          $group = Get-LocalGroup -Name 'Remote Desktop Users' `
            -ErrorAction Stop

          $membership = Get-LocalGroupMember `
            -Group $group `
            -ErrorAction SilentlyContinue

          if (-not ($membership | Where-Object { $_.Name -like "*\$Username" -or $_.Name -eq $Username })) {
            Add-LocalGroupMember -Group $group -Member $Username
          }

          Write-Host 'Windows account configured.'

      - name: Test RDP and Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tailscale = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          $ip = $null

          for ($i = 1; $i -le 12; $i++) {
            Write-Host "Waiting for Tailscale network ($i/12)..."

            $ipOutput = & $tailscale ip -4 2>$null

            if ($LASTEXITCODE -eq 0 -and $ipOutput) {
              $candidate = ($ipOutput | Select-Object -First 1).Trim()

              if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') {
                $ip = $candidate
                break
              }
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ip) {
            & $tailscale status
            throw 'Tailscale did not obtain an IPv4 address in time.'
          }

          "TAILSCALE_IP=$ip" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 -Append

          Write-Host "Tailscale IP: $ip"

          $listener = Get-NetTCPConnection `
            -State Listen `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          if ($listener) {
            Write-Host 'RDP port 3389 is listening.'
          }
          else {
            Write-Warning 'RDP port 3389 is not listening.'
          }

          Write-Host 'Tailscale network check completed.'

      - name: Show Connection Details
        if: ${{ success() }}
        shell: pwsh
        run: |
          Write-Host ''
          Write-Host '======= VIRTUAL PC DETAILS ======='
          Write-Host 'Windows account: Rafael'
          Write-Host "Windows password: Wl7mX#2026@Pc!"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host 'RDP port: 3389'
          Write-Host '=================================='

      - name: Keep Runner Active
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $endTime = (Get-Date).AddHours(5)

          while ((Get-Date) -lt $endTime) {
            Write-Host "Runner active: $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }

          Write-Host 'Wait period completed.'
